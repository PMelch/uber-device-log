# Source-derived, single-record observation; see ../README.md for evidence and limitations.
version: 1
id: android-slow-frame
name: Android slow HWUI frame
description: Observes HWUI Davey records and their reported duration. Does not measure all frames or identify the reason for delay. Completion means this diagnostic record was recognized.
priority: 2
starts:
  - opengl
  - hwui
timeout: 1s
correlation:
  scope: device-session
  primary: record
steps:
  - id: opengl
    name: Observe diagnostic record
    match:
      source: device
      platform: android
      tag: OpenGLRenderer
      regex: "^Davey! duration=[0-9]+(?:\\.[0-9]+)?ms; "
    extract:
      record:
        regex: (?<record>[^\r\n]+)
        group: record
        required: true
      durationMs:
        regex: ^Davey! duration=(?<durationMs>[0-9]+(?:\.[0-9]+)?)ms;
        group: durationMs
        required: true
        result: true
    label:
      - text: "Slow HWUI frame reported: {opengl.durationMs} ms"
        tone: warning
    outcome: completed
  - id: hwui
    name: Observe diagnostic record
    match:
      source: device
      platform: android
      tag: HWUI
      regex: "^Davey! duration=[0-9]+(?:\\.[0-9]+)?ms; "
    extract:
      record:
        regex: (?<record>[^\r\n]+)
        group: record
        required: true
      durationMs:
        regex: ^Davey! duration=(?<durationMs>[0-9]+(?:\.[0-9]+)?)ms;
        group: durationMs
        required: true
        result: true
    label:
      - text: "Slow HWUI frame reported: {hwui.durationMs} ms"
        tone: warning
    outcome: completed
